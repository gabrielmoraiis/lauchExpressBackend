# =============================================
# School Lunch Express - application.properties
# MVP - Banco H2 em memória (DEV)
# =============================================

spring.application.name=lunch-express
server.port=8080

# ---- BANCO H2 (DEV/MVP) ----
#spring.datasource.url=jdbc:h2:mem:lunchexpress;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
